[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "infrastructure-corridor-optimizer"
version = "0.1.0"
description = "Preliminary infrastructure corridor screening tools"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
geospatial = ["rasterio>=1.3", "fiona>=1.9", "shapely>=2.0"]
test = ["ruff>=0.8"]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
